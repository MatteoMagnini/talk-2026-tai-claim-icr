# Build and deploy Hugo + Reveal.js slides to GitHub Pages

name: Deploy Hugo site to Pages

on:
  push:
    tags: '*'
    branches:
      - master
      - main
    branches-ignore:
      - 'autodelivery**'
      - 'bump-**'
      - 'renovate/**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/update-hugo.yml'

  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      HUGO_VERSION: 0.147.8

    steps:
      # Install Hugo
      - name: Install Hugo CLI
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
          https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb

          sudo dpkg -i ${{ runner.temp }}/hugo.deb

      # Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Setup Pages
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      # Setup Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: shared-slides

      # Run custom preprocessing
      - name: Run the preprocessor
        run: shared-slides/preprocess.rb

      # Build with Hugo
      - name: Build with Hugo
        env:
          HUGO_CACHEDIR: ${{ runner.temp }}/hugo_cache
          HUGO_ENVIRONMENT: production
        run: |
          hugo \
            --minify \
            --baseURL "${{ steps.pages.outputs.base_url }}/"

      # Inline Mermaid
      - name: Transform and Inline Mermaid charts
        uses: cric96/inline-mermaid@1.14.1
        with:
          css-file-regex: '^css\\/.*custom.*theme.*\\.css$'
          root-folder: public
          config-file: config.toml

      # Disable Jekyll
      - name: Disable Jekyll
        run: touch public/.nojekyll

      # Upload Pages artifact
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
