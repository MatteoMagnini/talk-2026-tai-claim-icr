name: Build and deploy

on:
  push:
    tags: '*'
    branches-ignore:
      - 'autodelivery**'
      - 'bump-**'
      - 'renovate/**'
    paths-ignore:
      - 'README.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.github/workflows/update-hugo.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Checkout
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Compute Hugo version
      - name: Compute the version of Hugo
        id: hugo
        shell: bash
        run: |
          USES=$(cat <<TRICK_RENOVATE
          - uses: gohugoio/hugo@v0.147.8
          TRICK_RENOVATE
          )
          echo "version=${USES#*@v}" >> $GITHUB_OUTPUT

      # Install Hugo
      - name: Download Hugo
        run: |
          HUGO_VERSION="${{ steps.hugo.outputs.version }}"
          URL="https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          wget --retry-connrefused --waitretry=1 --read-timeout=20 "$URL" --output-document=hugo.deb

      - name: Install Hugo
        run: sudo dpkg -i hugo.deb

      - name: Print Hugo version
        run: hugo version

      - name: Remove Hugo Installer
        run: rm hugo.deb

      # Ruby
      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: shared-slides

      # Preprocess
      - name: Run the preprocessor
        run: shared-slides/preprocess.rb

      # Build
      - name: Build slides with Hugo
        run: hugo --minify

      # Mermaid
      - name: Transform and Inline Mermaid charts
        uses: cric96/inline-mermaid@1.14.1
        with:
          css-file-regex: '^css\\/.*custom.*theme.*\\.css$'
          root-folder: public
          config-file: config.toml

      # Prevent GitHub Pages/Jekyll interference
      - name: Disable Jekyll
        run: touch public/.nojekyll

      # Upload Pages artifact
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    if: github.event_name != 'pull_request'
    needs: build

    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  create-and-deploy-pdfs:
    runs-on: ubuntu-latest
    concurrency:
      group: pdf-slides-${{ github.event_name }}-${{ github.ref }}
      cancel-in-progress: false

    needs:
      - deploy

    permissions:
      contents: write

    steps:
      - name: Checkout the PDF creation script
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          path: pages
          ref: gh-pages

      - name: Create version
        id: version-compute
        run: echo "version=$(date +"%Y.%m.%d")" >> "$GITHUB_OUTPUT"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: shared-slides

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
        with:
          chrome-version: stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Make the pdfs
        run: shared-slides/makepdfs.rb pages

      - name: Deliver the pdfs
        if: ${{ github.ref_name == 'main' || github.ref_name == 'master' }}
        uses: ncipollo/release-action@v1.16.0
        with:
          allowUpdates: true
          artifacts: "*.pdf"
          replacesArtifacts: true
          tag: ${{ steps.version-compute.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}